site_name: zmath01
site_description: zmath01 - math, code, and everything in between
site_author: zmath01
site_url: https://zmath01.github.io/

repo_name: github.com/zmath01
repo_url: https://github.com/zmath01

# ──────────────────────────────────────────────
# Theme (Material for MkDocs 9)
# ──────────────────────────────────────────────
theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs            # top-level sections as tabs
    - navigation.sections
    - navigation.expand
    - navigation.top             # back-to-top button
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy          # copy button on code blocks
    - content.tabs.link
  font: false                    # system fonts, faster load

# ──────────────────────────────────────────────
# Markdown extensions
# ──────────────────────────────────────────────
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      linenums: true             # line numbers on code blocks
      line_spans: __span
      pygments_lang_class: true
      anchor_linenums: true      # clickable line-number anchors
  - pymdownx.arithmatex:
      generic: true              # MathJax via $...$ / $$...$$ / \(...\)
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink          # auto-linkify bare URLs / emails
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true            # right-side TOC with clickable anchors

# ──────────────────────────────────────────────
# Plugins
# ──────────────────────────────────────────────
# NOTE: jieba (in requirements.txt) enables CJK-aware full-text search.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true

# ──────────────────────────────────────────────
# JavaScript / CSS
# ──────────────────────────────────────────────
extra_javascript:
  - javascripts/mathjax.js       # MathJax config, must load BEFORE the loader
  - javascripts/mathjax-loader.js
  - javascripts/reading-time.js  # estimated reading time under each h1

extra_css:
  - stylesheets/extra.css

# ──────────────────────────────────────────────
# Umami analytics (privacy-friendly viewer stats)
# Umami Cloud: url is fixed; id = the Website ID shown on the site's
# dashboard (Settings -> Websites -> ID column). Fill BOTH to enable.
# ──────────────────────────────────────────────
extra:
  umami:
    url: "https://cloud.umami.is/script.js"
    id: "d6472404-59c6-4957-817c-8074d307c0c2"    # <-- paste your Website ID here
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zmath01

copyright: Copyright &copy; 2026 zmath01

# ──────────────────────────────────────────────
# Navigation: auto-generated by hooks/gen_nav.py on every build.
# Blog posts are grouped by year, newest first; adding or deleting a
# file in docs/blog/ updates the nav automatically (no dead links).
# ──────────────────────────────────────────────
hooks:
  - hooks/gen_nav.py
